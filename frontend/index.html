<!doctype html>

<html>
  <head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <header>
        <div class="top">
        <img src="../assets/boxer lottie.svg" alt="Animated boxer character." />
      <h2>Ready for today's pump ?</h2>
        </div>

    <main>

            </li>
            <li>

            <li>

            <li>

</html>
